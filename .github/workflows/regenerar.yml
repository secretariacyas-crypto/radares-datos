name: Regenerar tramos de radar móvil

# Cada día se comprueba si la DGT ha publicado un PDF de radares distinto y, si es así, se
# regeneran los tramos. El día 1 de cada mes se regeneran aunque el PDF no haya cambiado, para
# incorporar las mejoras de OpenStreetMap y CartoCiudad.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "41 2 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerar aunque el PDF de la DGT no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: regenerar
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install pdfplumber==0.11.4

      - name: Tests del generador
        run: python -m unittest discover -s . -p "test_*.py"

      # Descargas de OpenStreetMap y CartoCiudad de ejecuciones anteriores (ahorran horas).
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .cache
          key: descargas-${{ github.run_id }}
          restore-keys: descargas-

      - name: Generar
        id: gen
        run: |
          if [ "${{ github.event.schedule }}" = "41 2 1 * *" ] || [ "${{ inputs.force }}" = "true" ]; then
            python build_mobile_zones.py
          else
            python build_mobile_zones.py --if-changed
          fi

      # Se guarda también si la generación falla, para que el siguiente intento no empiece de cero.
      - uses: actions/cache/save@v6.1.0
        if: always() && hashFiles('.cache/**') != ''
        with:
          path: .cache
          key: descargas-${{ github.run_id }}

      - name: Publicar
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_zones.json report.json fuente.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Tramos regenerados (informe DGT ${{ steps.gen.outputs.report_date }}, ${{ steps.gen.outputs.km }} km, ${{ steps.gen.outputs.percent }})"
          git push

      - name: Avisar del fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create regeneracion --color D93F0B --description "Fallos de la regeneración automática" --force
          if [ -z "$(gh issue list --label regeneracion --state open --json number --jq '.[].number')" ]; then
            gh issue create --label regeneracion \
              --title "Falló la regeneración de tramos de radar móvil" \
              --body "La ejecución ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ha fallado. No se ha publicado nada: la app sigue usando los últimos tramos buenos. Revisa el registro (puede que la DGT haya cambiado el formato del PDF o que un servicio no respondiera)."
          fi
